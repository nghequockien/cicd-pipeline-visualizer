version: 0.2

phases:
  install:
    commands:
      - echo Installing dependencies
      - npm install -g pnpm

  pre_build:
    commands:
      - echo Running pre-build tasks
      - pnpm install

  build:
    commands:
      - echo Building the application
      - pnpm build

  post_build:
    commands:
      - echo Build completed successfully

artifacts:
  files:
    - dist/**/*
  name: BuildArtifact

cache:
  paths:
    - "/root/.pnpm-store/**/*"
